slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 8.0
    minimum_time_interval: 0.10
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # Scan Matching & Filtering (Tuned to reduce aggressive over-correction)
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.15
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.80
    link_match_minimum_response_coarse: 0.40
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 4.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 0.3
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.85

    # Correlation search parameters (Tightened to prevent over-correction jumps)
    correlation_search_space_dimension: 0.18
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03
    distance_variance_penalty: 1.2
    angle_variance_penalty: 2.0
