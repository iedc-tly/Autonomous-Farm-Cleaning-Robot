<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Motor Control – eightplanes.local</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a57ff" />
  <style>
    :root {
      --gap: 12px;
      --btn-size: 84px;   /* makes buttons larger on mobile */
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#222;
      background:#ffffff;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: var(--gap);
      max-width: 520px;
      margin: 0 auto;
    }
    header {
      display:flex; align-items:center; justify-content:space-between;
    }
    h1 { font-size: 1.25rem; margin: 0; }
    .card {
      border: 1px solid #e6e6e6;
      border-radius: var(--radius);
      padding: 14px;
      background: #fff;
    }
    .row { display:flex; align-items:center; gap: var(--gap); flex-wrap: wrap; }
    .spacer { flex: 1; }

    /* Speed control */
    .slider { display:flex; align-items:center; gap: 10px; width: 100%; }
    .slider input[type="range"] { flex: 1; }
    .val {
      min-width: 3.2ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #333;
    }
    .bump {
      width: 44px; height: 42px;
      border-radius: 10px; border:1px solid #b8c7ff; background:#f2f6ff;
      font-size: 1.1rem; font-weight: 600;
    }

    /* D-pad */
    .pad {
      display:grid;
      grid-template-columns: var(--btn-size) var(--btn-size) var(--btn-size);
      grid-template-rows: var(--btn-size) var(--btn-size) var(--btn-size);
      gap: 10px;
      justify-content: center;
      margin: 6px auto;
      touch-action: none; /* better pointer handling */
    }
    .pad button {
      width: 100%; height: 100%;
      border-radius: 16px; border:1px solid #cfcfcf;
      background:#fff; font-size: 1.2rem; font-weight: 600;
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    }
    .pad button.primary { background:#0a57ff; color:#fff; border-color:#0a57ff; }
    .pad button:active { transform: translateY(1px); }

    /* Status row */
    .status {
      display:flex; align-items:center; justify-content:space-between;
      color:#666; font-size:.95rem;
    }

    /* Sticky emergency stop */
    .sticky {
      position: sticky; bottom: env(safe-area-inset-bottom, 0);
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }
    .stop {
      width: 100%;
      height: 56px;
      border-radius: 14px;
      border: none;
      font-size: 1.05rem; font-weight: 700;
      background: #b00020; color: #fff;
      box-shadow: 0 2px 8px rgba(176,0,32,.25);
    }

    /* Small screens tune-up */
    @media (max-width: 380px) {
      :root { --btn-size: 76px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>EIGHTPLANES ARGI</h1>
      <div id="status">stopped</div>
    </header>

    <!-- Speed control -->
    <div class="card">
      <div class="row">
        <button class="bump" id="minus">−</button>
        <div class="slider">
          <strong>Speed</strong>
          <input id="speed" type="range" min="0" max="100" value="40" />
          <span class="val" id="speedVal">0.40</span>
        </div>
        <button class="bump" id="plus">+</button>
      </div>
    </div>

    <!-- Touch-friendly D-pad (Left/Right are PIVOT) -->
    <div class="card">
      <div class="pad">
        <div></div>                     <button id="up"    class="primary">▲</button> <div></div>
        <button id="left">◀</button>    <div></div>                               <button id="right">▶</button>
        <div></div>                     <button id="down"  class="primary">▼</button> <div></div>
      </div>
    </div>

    <!-- Sticky STOP -->
    <div class="sticky">
      <button id="stop" class="stop">EMERGENCY STOP</button>
    </div>
  </div>

  <script>
    // ---------- helpers----------
    const statusEl = document.getElementById('status');
    const speedEl  = document.getElementById('speed');
    const speedVal = document.getElementById('speedVal');

    const getSpeed01 = () => Number(speedEl.value) / 100;
    const setStatus  = (s) => statusEl.textContent = s;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    function refreshSpeedLabel(){ speedVal.textContent = getSpeed01().toFixed(2); }
    refreshSpeedLabel();
    speedEl.addEventListener('input', refreshSpeedLabel);

    // +/- bumps
    document.getElementById('minus').addEventListener('click', () => {
      speedEl.value = clamp(Number(speedEl.value) - 5, 0, 100); refreshSpeedLabel();
    });
    document.getElementById('plus').addEventListener('click', () => {
      speedEl.value = clamp(Number(speedEl.value) + 5, 0, 100); refreshSpeedLabel();
    });

    async function postJSON(url, body) {
      const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {}) });
      if (!r.ok) throw new Error(`${url} -> ${r.status}`);
      return r.json(); // we don't display it; just ensure success
    }
    async function drive(mode) {
      const speed = getSpeed01();
      setStatus(`${mode} @ ${speed.toFixed(2)}`);
      try { await postJSON('/api/drive', { mode, speed }); }
      catch { setStatus('error'); }
    }
    async function stop() {
      setStatus('stopped');
      try { await postJSON('/api/stop', {}); } catch { /* ignore */ }
    }

    // ---------- touch/desktop control: press-and-hold ----------
    function bindHold(btn, mode) {
      const down = (ev) => { ev.preventDefault(); drive(mode); btn.setAttribute('data-active','1'); };
      const up   = (ev) => { ev.preventDefault(); if (btn.getAttribute('data-active')) { stop(); btn.removeAttribute('data-active'); } };

      btn.addEventListener('pointerdown', down, {passive:false});
      btn.addEventListener('pointerup', up, {passive:false});
      btn.addEventListener('pointercancel', up, {passive:false});
      btn.addEventListener('pointerleave', up, {passive:false});

      // Keyboard fallback (click)
      btn.addEventListener('click', (e) => { e.preventDefault(); drive(mode); setTimeout(stop, 200); });
    }

    bindHold(document.getElementById('up'),    'forward');
    bindHold(document.getElementById('down'),  'backward');
    bindHold(document.getElementById('left'),  'left');   // pivot left (right fwd, left back)
    bindHold(document.getElementById('right'), 'right');  // pivot right (left fwd, right back)

    // Emergency stop
    document.getElementById('stop').addEventListener('click', (e) => { e.preventDefault(); stop(); });

    // Keyboard quick controls
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.code === 'ArrowUp') drive('forward');
      else if (e.code === 'ArrowDown') drive('backward');
      else if (e.code === 'ArrowLeft') drive('left');
      else if (e.code === 'ArrowRight') drive('right');
      else if (e.code === 'Space') { stop(); e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) stop();
    });

    // Best-effort stop when leaving page
    window.addEventListener('beforeunload', () => navigator.sendBeacon('/api/stop', JSON.stringify({})));
  </script>
</body>
</html>
